<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💛</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* ---------- HEART RAIN ---------- */
.heart{
  position:fixed;
  width:14px;height:14px;
  background:gold;
  transform:rotate(45deg);
  animation:fall linear infinite;
  filter:drop-shadow(0 0 8px gold);
  z-index:0;
}
.heart:before,.heart:after{
  content:"";
  position:absolute;
  width:14px;height:14px;
  background:gold;
  border-radius:50%;
}
.heart:before{top:-7px}
.heart:after{left:-7px}
@keyframes fall{
  from{transform:translateY(-10vh) rotate(45deg)}
  to{transform:translateY(110vh) rotate(45deg)}
}

/* ---------- PAGES ---------- */
.page{
  min-height:100vh;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:1;
  padding:20px;
}
.page.active{display:flex}

h1{
  color:gold;
  margin-bottom:25px;
  text-shadow:0 0 18px gold;
}

.btns{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:12px 30px;
  font-size:1rem;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
  border:none;
}
.yes{
  background:gold;
  color:#000;
  box-shadow:0 0 15px gold;
}
.no{
  background:#111;
  color:gold;
  border:1px solid gold;
}
button:hover{transform:scale(1.1)}

/* ---------- QUIZ ---------- */
.quiz{
  width:100%;
  max-width:360px;
  background:#0d0d0d;
  border:1px solid gold;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.options button{
  background:#111;
  color:gold;
  border:1px solid gold;
}
.feedback{margin-top:8px;font-weight:bold}
.correct{color:#00ff99}
.wrong{color:#ff4d4d}

/* ---------- VIDEO WALL ---------- */
.wall{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,auto);
  gap:40px;
  align-items:center;
  justify-items:center;
}

/* VIDEO */
.video-box{
  grid-column:2/4;
  grid-row:2;
}
video{
  width:340px;
  border-radius:22px;
  box-shadow:0 0 45px gold;
}

/* PHOTO FRAME */
.photo{
  width:170px;
  height:170px;
  background:#050505;
  padding:8px;
  border-radius:14px;
  border:3px solid gold;
  box-shadow:
    0 15px 35px rgba(0,0,0,.9),
    0 0 20px rgba(255,215,0,.8);
  transition:.4s;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  border-radius:10px;
}
.photo:hover{
  transform:scale(1.12);
  box-shadow:0 0 45px gold;
}

/* ---------- MOBILE ---------- */
@media(max-width:900px){
  .wall{
    grid-template-columns:repeat(3,1fr);
    gap:25px;
  }
  .video-box{grid-column:1/4}
  video{width:280px}
  .photo{width:120px;height:120px}
}

/* ---------- PAGE 1 BLUR BOX ---------- */
.glass-box{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,215,0,0.5);
  box-shadow:
    0 0 25px rgba(255,215,0,.4),
    inset 0 0 25px rgba(255,255,255,.05);
  border-radius: 22px;
  padding: 40px 30px;
  max-width: 420px;
  width: 100%;
}
.glass-box{
  position: relative;   /* IMPORTANT */
}

/* QUIZ BACKGROUND */
#p3{
  background:
    radial-gradient(circle at top, #2b1b00, #000 70%);
}

/* GLASS BOX */
.quiz-glass{
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,215,0,.35);
  border-radius: 24px;
  padding: 30px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 0 40px rgba(255,215,0,.4);
}

/* QUIZ CARD */
.quiz-card{
  background:#0b0b0b;
  border-radius:18px;
  padding:20px;
  border:1px solid gold;
}

.quiz-card p{
  margin-bottom:15px;
  font-size:1.1rem;
}

#feedback{
  margin-top:12px;
  font-weight:bold;
}


</style>
</head>

<body>

<script>
for(let i=0;i<35;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(h);
}
</script>

<!-- PAGE 1 -->
<div class="page active" id="p1">
  <div class="glass-box">
    <h1>Bhavaa will be my Valentine..? 💛</h1>
    <div class="btns">
      <button class="yes" onclick="next(2)">Yes</button>
      <button class="no" id="run">No</button>
    </div>
  </div>
</div>


<!-- PAGE 2 -->
<div class="page" id="p2">
  <div class="glass-box">
    <h1>Did you love me...? 🥺</h1>
    <div class="btns">
      <button class="yes" id="yesBig" onclick="next(3)">Yes</button>
      <button class="no" onclick="grow()">No</button>
    </div>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
  <div class="quiz-glass">
    <h1>Mini Quiz 💛</h1>

    <div class="quiz-card">
      <p id="question"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <button class="yes" id="finalBtn" style="display:none" onclick="next(4)">
      Finally 💖
    </button>
  </div>
</div>


<!-- PAGE 4 -->
<div class="page" id="p4">
  <h1>Forever Us 💛</h1>

  <div class="wall">
    <!-- Row 1 -->
    <div class="photo"><img src="images (1).jpg"></div>
    <div class="photo"><img src="images (6).jpg"></div>
    <div class="photo"><img src="images (5).jpg"></div>
    <div class="photo"><img src="images (3).jpg"></div>

    <!-- Row 2 -->
    <div class="photo"><img src="images (2).jpg"></div>

    <div class="video-box">
      <video src="mixkit-lovers-walking-through-a-lavender-field-4530-4k.mp4"
             autoplay loop muted playsinline></video>
    </div>

    <div class="photo"><img src="images (4).jpg"></div>

    <!-- Row 3 -->
    <div class="photo"><img src="images (3).jpg"></div>
    <div class="photo"><img src="images (6).jpg"></div>
    <div class="photo"><img src="images (7).jpg"></div>
    <div class="photo"><img src="images (7).jpg"></div>
  </div>
</div>

<script>
function next(n){
  document.querySelector(".page.active").classList.remove("active");
  document.getElementById("p"+n).classList.add("active");
}

/* RUNAWAY NO */
const r=document.getElementById("run");
r.onmouseover = r.ontouchstart = () => {
  const box = document.querySelector(".glass-box");
  const rect = box.getBoundingClientRect();

  r.style.position = "absolute";

  const maxX = rect.width - r.offsetWidth - 10;
  const maxY = rect.height - r.offsetHeight - 10;

  r.style.left = Math.random() * maxX + "px";
  r.style.top  = Math.random() * maxY + "px";
};


/* GROW YES */
function grow(){
  document.getElementById("yesBig").style.transform="scale(1.6)";
}

/* QUIZ */
const quizData = [
 {q:"Bhavaa is cute?", opts:["Yes","No","Maybe","Always"], ans:"Always"},
 {q:"what's my favourite colour.?", opts:["Red","Green","Blue","Yellow"], ans:"Green"},
 {q:"Gold theme looks good?", opts:["No","Yes","Bad","Ugly"], ans:"Yes"},
 {q:"what's my favourite food.?", opts:["biriyani","idli","fried rice","parotta"], ans:"biriyani"},
 {q:"who's my favourite person..?", opts:["Fear","Money","you","Nothing"], ans:"you"}
];

let index = 0;

const qEl = document.getElementById("question");
const optEl = document.getElementById("options");
const fbEl = document.getElementById("feedback");
const finalBtn = document.getElementById("finalBtn");

function loadQuiz(){
  fbEl.textContent="";
  optEl.innerHTML="";
  qEl.textContent = quizData[index].q;

  quizData[index].opts.forEach(o=>{
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = ()=>checkAnswer(o);
    optEl.appendChild(b);
  });
}

function checkAnswer(choice){
  if(choice === quizData[index].ans){
    fbEl.textContent = "Awesome! Correct 😍";
    fbEl.className = "feedback correct";

    setTimeout(()=>{
      index++;
      if(index < quizData.length){
        loadQuiz();
      }else{
        finalBtn.style.display = "inline-block";
        qEl.textContent = "You completed everything 💛";
        optEl.innerHTML="";
        fbEl.textContent="";
      }
    },800);
  }else{
    fbEl.textContent = "hahaha wrong answer 😝";
    fbEl.className = "feedback wrong";
  }
}

loadQuiz();
</script>

</body>
</html>
